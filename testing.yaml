services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: testing
      POSTGRES_PASSWORD: queer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  rustfs:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ROOT_USER: testing
      RUSTFS_ROOT_PASSWORD: queer
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
volumes:
  postgres_data:
  rustfs_data: